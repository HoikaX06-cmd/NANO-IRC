<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NANO-IRC | GOVERNANCE MODE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { background-color: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 100; }
        #auth-box { border: 2px solid #00ff41; padding: 30px; background: #0d0d0d; width: 350px; text-align: center; }
        .auth-input { background: #000; border: 1px solid #004411; color: #00ff41; width: 100%; padding: 10px; margin: 10px 0; outline: none; }
        .auth-btn { background: #004411; color: #00ff41; border: 1px solid #00ff41; padding: 10px 20px; cursor: pointer; width: 100%; }

        #sidebar { width: 260px; border-right: 2px solid #004411; background: #0d0d0d; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        #chat-container { flex-grow: 1; display: flex; flex-direction: column; background: #0a0a0a; position: relative; }
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; font-size: 14px; line-height: 1.5; }
        
        /* СТИЛИ ТЕКСТА */
        .msg-line { margin-bottom: 5px; }
        .msg-time { color: #008822; margin-right: 8px; font-size: 11px; }
        .msg-user { color: #fff; font-weight: bold; margin-right: 8px; }
        .msg-system { color: #ffaa00; font-style: italic; }
        .msg-me { color: #d18aff; font-style: italic; }
        .msg-error { color: #ff3333; font-weight: bold; background: rgba(255,0,0,0.1); }
        
        /* ИНДИКАТОР ПЕЧАТИ */
        #typing-indicator { height: 20px; padding: 0 20px; font-size: 11px; color: #008822; font-style: italic; }

        #input-area { height: 50px; border-top: 2px solid #004411; display: flex; align-items: center; padding: 0 15px; background: #0d0d0d; }
        #user-input { background: transparent; border: none; color: #fff; flex-grow: 1; outline: none; font-size: 15px; font-family: inherit; }

        .online-user { color: #00ff41; font-size: 13px; margin-bottom: 3px; }
        .tg-link { border: 1px dashed #00ff41; padding: 8px; text-decoration: none; color: #00ff41; font-size: 10px; text-align: center; display: block; margin-top: 15px; }
        h3 { border-bottom: 1px solid #004411; padding-bottom: 5px; margin-top: 15px; font-size: 13px; color: #008822; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div id="auth-box">
            <h2 style="letter-spacing: 2px;">NANO_SYSTEM_v7</h2>
            <input type="text" id="auth-nick" class="auth-input" placeholder="NICKNAME">
            <input type="password" id="auth-pass" class="auth-input" placeholder="PASSWORD">
            <button class="auth-btn" onclick="tryLogin()">INITIALIZE</button>
            <p id="auth-error" style="color:red; font-size:11px; margin-top:10px"></p>
        </div>
    </div>

    <div id="main-ui">
        <div id="sidebar">
            <div>
                <h3>ROOT_OPERATOR</h3>
                <div id="my-nick" style="color:#fff; font-weight: bold;"></div>
                <div id="current-chan" style="color:#ffaa00; font-size: 11px;">#general</div>

                <h3>ONLINE</h3>
                <div id="user-list"></div>

                <h3>MOD_COMMANDS</h3>
                <div style="font-size: 10px; color: #008822;">
                    #kick [nick] - выкинуть<br>
                    #ban [nick] - навсегда<br>
                    /me [action] - действие
                </div>
            </div>
            <a href="https://t.me/+EB8M8N-icHsyYjZi" target="_blank" class="tg-link">[ JOIN TELEGRAM ]</a>
        </div>

        <div id="chat-container">
            <div id="messages"></div>
            <div id="typing-indicator"></div>
            <div id="input-area">
                <span id="prompt" style="margin-right:10px; font-weight:bold; color:#008822">#general></span>
                <input type="text" id="user-input" autofocus autocomplete="off">
            </div>
        </div>
    </div>

    <audio id="beep-sound" src="https://www.soundjay.com/buttons/button-50.mp3" preload="auto"></audio>

    <script>
        const SUPABASE_URL = 'https://lwqcytxnpmdkrgiiirnp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3cWN5dHhucG1ka3JnaWlpcm5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NTE3NjMsImV4cCI6MjA4ODAyNzc2M30.IR6sZosUZdpNN3iHmPW1bVldjpNgvwqWU04he6bjZg4';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = "";
        let currentChannel = "general";
        let channelOwner = "";
        let presenceChannel;

        const beep = document.getElementById('beep-sound');

        // Хеширование
        function hash(p) { return CryptoJS.SHA256(p).toString(); }

        // Парсинг Markdown (жирный и курсив)
        function parseMarkdown(text) {
            return text
                .replace(/\*(.*?)\*/g, '<b>$1</b>')
                .replace(/_(.*?)_/g, '<i>$1</i>');
        }

        async function tryLogin() {
            const nick = document.getElementById('auth-nick').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            if(!nick || !pass) return;

            const hashed = hash(pass);
            const { data: user } = await _supabase.from('profiles').select('*').eq('username', nick).single();
            
            if (user) {
                if (user.is_banned) {
                    document.getElementById('auth-error').innerText = "ACCESS REVOKED: YOU ARE BANNED";
                    return;
                }
                if (user.password === hashed) startChat(nick);
                else document.getElementById('auth-error').innerText = "WRONG PASSWORD";
            } else {
                await _supabase.from('profiles').insert([{ username: nick, password: hashed }]);
                startChat(nick);
            }
        }

        async function startChat(nick) {
            currentUser = nick;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('main-ui').style.display = 'flex';
            document.getElementById('my-nick').innerText = "@" + nick;
            
            setupPresence(nick);
            switchChannel("general");
        }

        function setupPresence(nick) {
            presenceChannel = _supabase.channel('presence-node', { config: { presence: { key: nick } } });
            presenceChannel
                .on('presence', { event: 'sync' }, () => {
                    const state = presenceChannel.presenceState();
                    const list = document.getElementById('user-list');
                    list.innerHTML = "";
                    Object.keys(state).forEach(u => {
                        const isTyping = state[u][0]?.typing ? " (typing...)" : "";
                        list.innerHTML += `<div class="online-user">● ${u}${isTyping}</div>`;
                    });
                })
                .subscribe(async (s) => { if(s==='SUBSCRIBED') await presenceChannel.track({ online_at: new Date() }); });
        }

        function print(text, type = 'system') {
            const div = document.createElement('div');
            div.className = 'msg-line';
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            if (type === 'error') div.innerHTML = `<span class="msg-error">!! ${text}</span>`;
            else if (type === 'system') div.innerHTML = `<span class="msg-system">*** ${text}</span>`;
            else if (type === 'me') div.innerHTML = `<span class="msg-time">[${time}]</span> <span class="msg-me">* ${text}</span>`;
            else div.innerHTML = `<span class="msg-time">[${time}]</span> ${text}`;
            
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        async function switchChannel(name) {
            name = name.replace('#', '').trim();
            const { data: room } = await _supabase.from('rooms').select('*').eq('slug', name).single();
            
            if (!room && name !== 'general') {
                print(`Error 19: Room #${name} not found.`, "error");
                return;
            }

            currentChannel = name;
            channelOwner = room ? room.owner : "";
            document.getElementById('current-chan').innerText = "#" + name;
            document.getElementById('prompt').innerText = "#" + name + ">";
            document.getElementById('messages').innerHTML = "";
            print(`Entering channel #${name}...`);

            const { data: hist } = await _supabase.from('messages').select('*').eq('channel', name).is('recipient', null).order('created_at', { ascending: true });
            if (hist) hist.forEach(m => {
                const content = m.content.startsWith('/me ') ? `* ${m.username} ${m.content.substring(4)}` : `<span class="msg-user">&lt;${m.username}&gt;</span> ${parseMarkdown(m.content)}`;
                print(content, m.content.startsWith('/me ') ? 'me' : 'chat');
            });
        }

        // Ввод текста
        const input = document.getElementById('user-input');
        input.addEventListener('input', () => {
            presenceChannel.track({ typing: input.value.length > 0, online_at: new Date() });
        });

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                e.target.value = '';
                presenceChannel.track({ typing: false, online_at: new Date() });

                // МОДЕРАЦИЯ (MrRobot или Owner)
                const isMod = (currentUser === 'MrRobot' || currentUser === channelOwner);

                if (val.startsWith('#create ')) {
                    const rName = val.split(' ')[1];
                    const { error } = await _supabase.from('rooms').insert([{ slug: rName, owner: currentUser }]);
                    if (error) print("Error 21: Name taken.", "error");
                    else print(`Room #${rName} created. You are the OWNER.`);
                }
                else if (val.startsWith('#kick ') && isMod) {
                    const target = val.split(' ')[1];
                    await _supabase.from('messages').insert([{ username: 'SYSTEM', content: `/kick ${target}`, channel: currentChannel }]);
                }
                else if (val.startsWith('#ban ') && isMod) {
                    const target = val.split(' ')[1];
                    await _supabase.from('profiles').update({ is_banned: true }).eq('username', target);
                    print(`USER ${target} PERMANENTLY BANNED.`, "error");
                }
                else if (val.startsWith('#join ')) switchChannel(val.split(' ')[1]);
                else if (val !== "") {
                    const isMe = val.startsWith('/me ');
                    const content = isMe ? val : parseMarkdown(val);
                    await _supabase.from('messages').insert([{ username: currentUser, content: val, channel: currentChannel, recipient: null }]);
                    print(isMe ? `${currentUser} ${val.substring(4)}` : `<span class="msg-user">&lt;${currentUser}&gt;</span> ${content}`, isMe ? 'me' : 'chat');
                }
            }
        });

        _supabase.channel('realtime-node').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
            const m = p.new;
            if (m.username === currentUser) return;

            // Обработка кика в реальном времени
            if (m.content.startsWith('/kick ') && m.content.split(' ')[1] === currentUser) {
                alert("YOU HAVE BEEN KICKED BY MODERATOR");
                location.reload();
            }

            if (m.channel === currentChannel && !m.recipient) {
                beep.play(); // Звук!
                const isMe = m.content.startsWith('/me ');
                const content = isMe ? `${m.username} ${m.content.substring(4)}` : `<span class="msg-user">&lt;${m.username}&gt;</span> ${parseMarkdown(m.content)}`;
                print(content, isMe ? 'me' : 'chat');
            }
        }).subscribe();
    </script>
</body>
</html>
