<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NANO-IRC | Terminal Active</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 100; }
        #auth-box { border: 2px solid #00ff41; padding: 30px; background: #0d0d0d; width: 350px; text-align: center; }
        .auth-input { background: #000; border: 1px solid #004411; color: #00ff41; width: 100%; padding: 10px; margin: 10px 0; outline: none; font-family: inherit; }
        .auth-btn { background: #004411; color: #00ff41; border: 1px solid #00ff41; padding: 10px 20px; cursor: pointer; width: 100%; }
        #main-ui { display: none; width: 100%; height: 100%; }
        #sidebar { width: 250px; border-right: 2px solid #004411; background: #0d0d0d; padding: 15px; }
        #chat-container { flex-grow: 1; display: flex; flex-direction: column; }
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; font-size: 14px; line-height: 1.5; }
        #input-area { height: 50px; border-top: 2px solid #004411; display: flex; align-items: center; padding: 0 15px; background: #0d0d0d; }
        #user-input { background: transparent; border: none; color: #fff; flex-grow: 1; outline: none; font-size: 16px; font-family: inherit; }
        .msg-line { margin-bottom: 5px; }
        .msg-time { color: #008822; margin-right: 8px; }
        .msg-user { color: #fff; font-weight: bold; margin-right: 8px; }
        .msg-error { color: #ff3333; font-weight: bold; }
        .msg-system { color: #ffaa00; font-style: italic; }
        .cmd-hint { color: #008822; font-size: 12px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div id="auth-box">
            <h2>TERMINAL LOGIN</h2>
            <input type="text" id="auth-nick" class="auth-input" placeholder="NICKNAME">
            <input type="password" id="auth-pass" class="auth-input" placeholder="PASSWORD">
            <button class="auth-btn" onclick="tryLogin()">CONNECT</button>
            <p id="auth-error" style="color:red; font-size:12px; margin-top:10px"></p>
        </div>
    </div>

    <div id="main-ui">
        <div id="sidebar">
            <h3 style="font-size: 14px; border-bottom: 1px solid #004411;">COMMANDS</h3>
            <div class="cmd-hint">#create [name]</div>
            <div class="cmd-hint">#join [name]</div>
            <div class="cmd-hint">@[nick] [msg]</div>
            <h3 style="font-size: 14px; border-bottom: 1px solid #004411; margin-top:20px;">INFO</h3>
            <div id="my-nick" style="color:#fff"></div>
            <div id="current-chan" style="color:#ffaa00">#general</div>
        </div>
        <div id="chat-container">
            <div id="messages"></div>
            <div id="input-area">
                <span id="prompt" style="margin-right:10px; font-weight:bold">#general></span>
                <input type="text" id="user-input" autofocus autocomplete="off">
            </div>
        </div>
    </div>

    <script>
        // Твои ключи вставлены
        const SUPABASE_URL = 'https://lwqcytxnpmdkrgiiirnp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3cWN5dHhucG1ka3JnaWlpcm5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NTE3NjMsImV4cCI6MjA4ODAyNzc2M30.IR6sZosUZdpNN3iHmPW1bVldjpNgvwqWU04he6bjZg4';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = "";
        let currentChannel = "general";

        async function tryLogin() {
            const nick = document.getElementById('auth-nick').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            if(!nick || !pass) return;

            const { data: user } = await _supabase.from('profiles').select('*').eq('username', nick).single();
            
            if (user) {
                if (user.password === pass) startChat(nick);
                else document.getElementById('auth-error').innerText = "WRONG PASSWORD";
            } else {
                await _supabase.from('profiles').insert([{ username: nick, password: pass }]);
                startChat(nick);
            }
        }

        async function startChat(nick) {
            currentUser = nick;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('main-ui').style.display = 'flex';
            document.getElementById('my-nick').innerText = "@" + nick;
            
            // Пытаемся создать general, если её нет
            await _supabase.from('rooms').insert([{ slug: 'general' }]);
            switchChannel("general");
        }

        function print(text, type = 'system') {
            const div = document.createElement('div');
            div.className = 'msg-line';
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            if (type === 'error') div.innerHTML = `<span class="msg-error">!! ${text}</span>`;
            else if (type === 'system') div.innerHTML = `<span class="msg-system">*** ${text}</span>`;
            else div.innerHTML = `<span class="msg-time">[${time}]</span> ${text}`;
            
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        async function switchChannel(name) {
            name = name.replace('#', '').trim();
            
            // Проверка комнаты
            const { data: room } = await _supabase.from('rooms').select('*').eq('slug', name).single();
            if (!room && name !== 'general') {
                print(`error 19 - комнаты #${name} не существует`, "error");
                return;
            }

            currentChannel = name;
            document.getElementById('current-chan').innerText = "#" + name;
            document.getElementById('prompt').innerText = "#" + name + ">";
            document.getElementById('messages').innerHTML = "";
            print(`Вы вошли в #${name}`);

            const { data: history } = await _supabase.from('messages')
                .select('*')
                .eq('channel', name)
                .is('recipient', null)
                .order('created_at', { ascending: true });
            
            if (history) history.forEach(m => print(`<span class="msg-user">&lt;${m.username}&gt;</span> ${m.content}`, 'chat'));
        }

        document.getElementById('user-input').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                e.target.value = '';

                if (val.startsWith('#create ')) {
                    const roomName = val.split(' ')[1].replace('#', '');
                    const { error } = await _supabase.from('rooms').insert([{ slug: roomName }]);
                    if (error) print("error 21 - комната уже существует", "error");
                    else print(`Комната #${roomName} создана!`);
                } 
                else if (val.startsWith('#join ')) {
                    switchChannel(val.split(' ')[1]);
                }
                else if (val.startsWith('@')) {
                    const parts = val.split(' ');
                    const target = parts[0].substring(1);
                    const msg = parts.slice(1).join(' ');
                    await _supabase.from('messages').insert([{ 
                        username: currentUser, 
                        content: msg, 
                        recipient: target, 
                        channel: currentChannel 
                    }]);
                    print(`[Лично для ${target}]: ${msg}`, 'system');
                }
                else if (val !== "") {
                    // Явное указание recipient: null помогает избежать ошибок в некоторых версиях Supabase
                    const { error } = await _supabase.from('messages').insert([{ 
                        username: currentUser, 
                        content: val, 
                        channel: currentChannel,
                        recipient: null
                    }]);
                    if (error) print("Ошибка базы: " + error.message, "error");
                    else print(`<span class="msg-user">&lt;${currentUser}&gt;</span> ${val}`, 'chat');
                }
            }
        });

        // Слушаем изменения
        _supabase.channel('irc').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
            const m = p.new;
            // Показываем сообщение если: канал совпадает И (это не личка ИЛИ это личка мне)
            if (m.channel === currentChannel && !m.recipient) {
                if(m.username !== currentUser) print(`<span class="msg-user">&lt;${m.username}&gt;</span> ${m.content}`, 'chat');
            } else if (m.recipient === currentUser) {
                print(`<span class="msg-private" style="color:#ff00ff">*[Личка от ${m.username}]* ${m.content}</span>`, 'chat');
            }
        }).subscribe();
    </script>
</body>
</html>
