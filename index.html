<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NANO-IRC | TOTAL ISOLATION v9.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #050505; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 100; }
        #auth-box { border: 2px solid #00ff41; padding: 30px; background: #0d0d0d; width: 350px; text-align: center; box-shadow: 0 0 20px #004411; }
        .auth-input { background: #000; border: 1px solid #00ff41; color: #00ff41; width: 100%; padding: 12px; margin: 10px 0; outline: none; font-family: inherit; }
        .auth-btn { background: #004411; color: #00ff41; border: 1px solid #00ff41; padding: 10px 20px; cursor: pointer; width: 100%; font-weight: bold; }
        #sidebar { width: 250px; border-right: 2px solid #004411; background: #080808; padding: 20px; display: flex; flex-direction: column; }
        #chat-container { flex-grow: 1; display: flex; flex-direction: column; background: #050505; }
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; font-size: 15px; line-height: 1.4; color: #e0e0e0; }
        .msg-line { margin-bottom: 8px; word-wrap: break-word; border-left: 2px solid #004411; padding-left: 10px; }
        .msg-time { color: #008822; font-size: 12px; margin-right: 10px; }
        .msg-user { color: #ffffff; font-weight: bold; margin-right: 8px; }
        .msg-content { color: #e0e0e0; }
        .msg-system { color: #ffaa00 !important; font-style: italic; }
        #input-area { height: 60px; border-top: 2px solid #004411; display: flex; align-items: center; padding: 0 20px; background: #0d0d0d; }
        #user-input { background: transparent; border: none; color: #ffffff; flex-grow: 1; outline: none; font-size: 16px; font-family: inherit; }
        h3 { color: #00ff41; font-size: 14px; border-bottom: 1px solid #004411; padding-bottom: 5px; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div id="auth-box">
            <h2 style="letter-spacing: 2px;">SHIELD_V9.0</h2>
            <input type="text" id="auth-nick" class="auth-input" placeholder="NICKNAME" maxlength="20">
            <input type="password" id="auth-pass" class="auth-input" placeholder="PASSWORD">
            <button class="auth-btn" onclick="tryLogin()">INIT_SESSION</button>
            <p id="auth-error" style="color:#ff4444; font-size:12px; margin-top:10px"></p>
        </div>
    </div>

    <div id="main-ui" style="display:none; width: 100%;">
        <div id="sidebar">
            <h3>OPERATOR</h3>
            <div id="my-nick" style="color:#fff; font-size: 16px; margin-bottom: 20px;"></div>
            <h3>STATUS</h3>
            <div style="font-size: 12px; color: #00ff41;">RLS_PROTECTION: ON</div>
            <div style="font-size: 12px; color: #00ff41;">XSS_SHIELD: ON</div>
            <div style="font-size: 12px; color: #00ff41;">DB_SYNC: ACTIVE</div>
        </div>

        <div id="chat-container">
            <div id="messages"></div>
            <div id="input-area">
                <span style="color:#00ff41; margin-right:10px;">#root></span>
                <input type="text" id="user-input" autofocus autocomplete="off" placeholder="Введите сообщение...">
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lwqcytxnpmdkrgiiirnp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3cWN5dHhucG1ka3JnaWlpcm5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NTE3NjMsImV4cCI6MjA4ODAyNzc2M30.IR6sZosUZdpNN3iHmPW1bVldjpNgvwqWU04he6bjZg4';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = "";

        async function tryLogin() {
            const nick = document.getElementById('auth-nick').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            if(!nick || !pass) return;

            const hashed = CryptoJS.SHA256(pass).toString();
            const { data: user, error } = await _supabase.from('profiles').select('*').eq('username', nick).maybeSingle();

            if (user) {
                if (user.is_banned) { alert("ACCOUNT TERMINATED"); return; }
                if (user.password === hashed) startChat(nick);
                else document.getElementById('auth-error').innerText = "ACCESS DENIED: INVALID KEY";
            } else {
                const { error: insErr } = await _supabase.from('profiles').insert([{ username: nick, password: hashed }]);
                if (insErr) { document.getElementById('auth-error').innerText = "NICKNAME TAKEN OR INVALID"; }
                else startChat(nick);
            }
        }

        function startChat(nick) {
            currentUser = nick;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('main-ui').style.display = 'flex';
            document.getElementById('my-nick').innerText = "@" + nick;
            
            // Realtime подписка
            _supabase.channel('public-room')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    if (payload.new.username !== currentUser) {
                        renderMessage(payload.new);
                    }
                })
                .subscribe();

            loadHistory();
        }

        async function loadHistory() {
            const { data } = await _supabase.from('messages').select('*').order('created_at', { ascending: true }).limit(50);
            if (data) data.forEach(m => renderMessage(m));
        }

        // ТОТ САМЫЙ "ЖЕЛЕЗНЫЙ ЩИТ"
        function renderMessage(msg) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'msg-line';
            
            const time = document.createElement('span');
            time.className = 'msg-time';
            time.textContent = `[${new Date(msg.created_at || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}]`;
            
            const user = document.createElement('span');
            user.className = 'msg-user';
            user.textContent = `<${msg.username}>`;
            
            // Если ник СИСТЕМА, подсвечиваем оранжевым
            if (msg.username === 'SYSTEM') user.className += ' msg-system';

            const content = document.createElement('span');
            content.className = 'msg-content';
            
            // ИСПОЛЬЗУЕМ textContent - это блокирует любые попытки хакера выполнить код
            content.textContent = msg.content; 

            div.appendChild(time);
            div.appendChild(user);
            div.appendChild(content);
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        const input = document.getElementById('user-input');
        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const val = input.value.trim();
                if (!val) return;
                input.value = '';

                // Сначала рисуем у себя (для скорости)
                renderMessage({ username: currentUser, content: val, created_at: new Date() });

                // Отправляем в базу
                const { error } = await _supabase.from('messages').insert([
                    { username: currentUser, content: val, channel: 'general' }
                ]);

                if (error) {
                    console.error("Security Block:", error.message);
                    // Если база отклонила (например, из-за RLS), можно вывести ошибку
                }
            }
        });
    </script>
</body>
</html>
