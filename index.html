<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>NANO-IRC | STABLE SYNC</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #050505; color: #00ff41; font-family: 'Courier New', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 100; }
        #auth-box { border: 2px solid #00ff41; padding: 30px; background: #0d0d0d; width: 350px; text-align: center; box-shadow: 0 0 20px #004411; }
        .auth-input { background: #000; border: 1px solid #00ff41; color: #00ff41; width: 100%; padding: 12px; margin: 10px 0; outline: none; font-family: inherit; }
        .auth-btn { background: #004411; color: #00ff41; border: 1px solid #00ff41; padding: 10px 20px; cursor: pointer; width: 100%; font-weight: bold; }
        #sidebar { width: 280px; border-right: 2px solid #004411; background: #080808; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        #chat-container { flex-grow: 1; display: flex; flex-direction: column; background: #050505; }
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; font-size: 15px; line-height: 1.4; color: #e0e0e0; }
        .msg-line { margin-bottom: 6px; padding-left: 8px; }
        .msg-time { color: #008822; margin-right: 10px; font-size: 12px; }
        .msg-user { color: #ffffff; font-weight: bold; margin-right: 8px; }
        .msg-system { color: #ffaa00; font-style: italic; }
        .msg-me { color: #d18aff; font-style: italic; }
        .msg-error { color: #ff4444; font-weight: bold; border-left: 2px solid #ff4444; padding-left: 10px; }
        #typing-indicator { height: 25px; padding: 0 20px; font-size: 12px; color: #00ff41; opacity: 0.8; }
        #input-area { height: 60px; border-top: 2px solid #004411; display: flex; align-items: center; padding: 0 20px; background: #0d0d0d; }
        #prompt { color: #00ff41; font-weight: bold; margin-right: 15px; white-space: nowrap; }
        #user-input { background: transparent; border: none; color: #ffffff; flex-grow: 1; outline: none; font-size: 16px; font-family: inherit; width: 100%; }
        .online-user { color: #00ff41; font-size: 14px; margin-bottom: 5px; }
        .tg-link { border: 1px solid #00ff41; padding: 12px; text-decoration: none; color: #00ff41; font-size: 12px; text-align: center; display: block; margin-top: 20px; }
        h3 { border-bottom: 1px solid #004411; padding-bottom: 8px; margin-top: 20px; font-size: 14px; color: #00ff41; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div id="auth-overlay"><div id="auth-box"><h2 style="color:#00ff41;">NANO_SYNC_v7.2</h2><input type="text" id="auth-nick" class="auth-input" placeholder="NICKNAME"><input type="password" id="auth-pass" class="auth-input" placeholder="PASSWORD"><button class="auth-btn" onclick="tryLogin()">INIT_SESSION</button><p id="auth-error" style="color:#ff4444; font-size:12px; margin-top:10px"></p></div></div>
    <div id="main-ui">
        <div id="sidebar"><div><h3>OPERATOR</h3><div id="my-nick" style="color:#fff; font-size: 18px;"></div><div id="current-chan-label" style="color:#ffaa00; margin-top: 5px;">#general</div><h3>ONLINE</h3><div id="user-list"></div><h3>MODS</h3><div style="font-size: 11px; color: #008822;">#kick [nick]<br>#ban [nick]<br>/me [action]</div></div><a href="https://t.me/+EB8M8N-icHsyYjZi" target="_blank" class="tg-link">Community Access</a></div>
        <div id="chat-container"><div id="messages"></div><div id="typing-indicator"></div><div id="input-area"><span id="prompt">#general></span><input type="text" id="user-input" autofocus autocomplete="off" placeholder="Message..."></div></div>
    </div>
    <audio id="beep-sound" src="https://www.soundjay.com/buttons/button-50.mp3" preload="auto"></audio>

    <script>
        const SUPABASE_URL = 'https://lwqcytxnpmdkrgiiirnp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3cWN5dHhucG1ka3JnaWlpcm5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NTE3NjMsImV4cCI6MjA4ODAyNzc2M30.IR6sZosUZdpNN3iHmPW1bVldjpNgvwqWU04he6bjZg4';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = "", currentChannel = "general", channelOwner = "", presenceChannel;
        const beep = document.getElementById('beep-sound');

        function hash(p) { return CryptoJS.SHA256(p).toString(); }
        function parseMarkdown(text) { return text.replace(/\*(.*?)\*/g, '<b>$1</b>').replace(/_(.*?)_/g, '<i>$1</i>'); }

        async function tryLogin() {
            const nick = document.getElementById('auth-nick').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            if(!nick || !pass) return;
            const hashed = hash(pass);
            const { data: user } = await _supabase.from('profiles').select('*').eq('username', nick).single();
            if (user) {
                if (user.is_banned) { alert("BANNED"); return; }
                if (user.password === hashed) startChat(nick);
                else document.getElementById('auth-error').innerText = "INVALID KEY";
            } else {
                await _supabase.from('profiles').insert([{ username: nick, password: hashed }]);
                startChat(nick);
            }
        }

        async function startChat(nick) {
            currentUser = nick;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('main-ui').style.display = 'flex';
            document.getElementById('my-nick').innerText = "@" + nick;
            setupRealtime();
            switchChannel("general");
        }

        function setupRealtime() {
            // Единый канал для Presence и Сообщений
            presenceChannel = _supabase.channel('global-sync', { config: { presence: { key: currentUser } } });

            presenceChannel
                .on('presence', { event: 'sync' }, () => {
                    const state = presenceChannel.presenceState();
                    const list = document.getElementById('user-list');
                    list.innerHTML = "";
                    Object.keys(state).forEach(u => {
                        const isTyping = state[u][0]?.typing ? " <span style='font-size:10px; color:#ffaa00'>...typing</span>" : "";
                        list.innerHTML += `<div class="online-user">● ${u}${isTyping}</div>`;
                    });
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    const m = payload.new;
                    handleIncomingMessage(m);
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') await presenceChannel.track({ online_at: new Date() });
                });
        }

        function handleIncomingMessage(m) {
            if (m.username === currentUser) return;
            // Обработка кика
            if (m.content.startsWith('/kick ') && m.content.split(' ')[1] === currentUser) {
                alert("TERMINATED BY MODERATOR");
                location.reload();
                return;
            }
            // Показ сообщения если канал совпадает
            if (m.channel === currentChannel && !m.recipient) {
                beep.play().catch(()=>{}); 
                const isMe = m.content.startsWith('/me ');
                const content = isMe ? `${m.username} ${m.content.substring(4)}` : `<span class="msg-user">&lt;${m.username}&gt;</span> ${parseMarkdown(m.content)}`;
                print(content, isMe ? 'me' : 'chat');
            } else if (m.recipient === currentUser) {
                print(`[Private from ${m.username}]: ${m.content}`, 'system');
            }
        }

        function print(text, type = 'system') {
            const div = document.createElement('div');
            div.className = 'msg-line';
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            if (type === 'error') div.innerHTML = `<span class="msg-error">!! ${text}</span>`;
            else if (type === 'system') div.innerHTML = `<span class="msg-system">*** ${text}</span>`;
            else if (type === 'me') div.innerHTML = `<span class="msg-time">[${time}]</span> <span class="msg-me">* ${text}</span>`;
            else div.innerHTML = `<span class="msg-time">[${time}]</span> ${text}`;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        async function switchChannel(name) {
            name = name.replace('#', '').trim();
            // Сначала проверяем базу
            const { data: room, error } = await _supabase.from('rooms').select('*').eq('slug', name).maybeSingle();
            
            if (!room && name !== 'general') {
                print(`Error 19: Channel #${name} not found.`, "error");
                return;
            }

            currentChannel = name;
            channelOwner = room ? room.owner : "";
            document.getElementById('current-chan-label').innerText = "#" + name;
            document.getElementById('prompt').innerText = "#" + name + ">";
            document.getElementById('messages').innerHTML = "";
            print(`Accessing #${name}...`, 'system');

            const { data: hist } = await _supabase.from('messages').select('*').eq('channel', name).is('recipient', null).order('created_at', { ascending: true });
            if (hist) hist.forEach(m => {
                const isMeCmd = m.content.startsWith('/me ');
                const content = isMeCmd ? `${m.username} ${m.content.substring(4)}` : `<span class="msg-user">&lt;${m.username}&gt;</span> ${parseMarkdown(m.content)}`;
                print(content, isMeCmd ? 'me' : 'chat');
            });
        }

        const input = document.getElementById('user-input');
        input.addEventListener('input', () => { presenceChannel.track({ typing: input.value.length > 0, online_at: new Date() }); });

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                e.target.value = '';
                presenceChannel.track({ typing: false, online_at: new Date() });
                const isMod = (currentUser === 'MrRobot' || currentUser === channelOwner);

                if (val.startsWith('#create ')) {
                    const rName = val.split(' ')[1].replace('#','');
                    await _supabase.from('rooms').insert([{ slug: rName, owner: currentUser }]);
                    print(`Created #${rName}. Try #join ${rName}`);
                }
                else if (val.startsWith('#kick ') && isMod) {
                    const target = val.split(' ')[1];
                    await _supabase.from('messages').insert([{ username: 'SYSTEM', content: `/kick ${target}`, channel: currentChannel }]);
                }
                else if (val.startsWith('#join ')) {
                    setTimeout(() => switchChannel(val.split(' ')[1]), 500); // Небольшая задержка для синхронизации базы
                }
                else if (val.startsWith('#clear')) document.getElementById('messages').innerHTML = "";
                else if (val !== "") {
                    const isMe = val.startsWith('/me ');
                    const display = isMe ? `${currentUser} ${val.substring(4)}` : `<span class="msg-user">&lt;${currentUser}&gt;</span> ${parseMarkdown(val)}`;
                    print(display, isMe ? 'me' : 'chat');
                    await _supabase.from('messages').insert([{ username: currentUser, content: val, channel: currentChannel, recipient: null }]);
                }
            }
        });
    </script>
</body>
</html>
